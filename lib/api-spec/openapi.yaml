openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Public moving quote requests
  - name: admin
    description: Authenticated enquiry management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: createLead
      tags: [enquiries]
      summary: Submit a moving quote request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Quote request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCreated"
        "400":
          description: Invalid request
        "429":
          description: Too many requests
        "503":
          description: Enquiry storage is not configured
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check whether the signed-in account is an administrator
      responses:
        "200":
          description: Administrator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
  /admin/leads:
    get:
      operationId: listLeads
      tags: [admin]
      summary: Search and filter quote requests
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeadStatus"
        - name: source
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Matching leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadPage"
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "503":
          description: Enquiry storage is not configured
  /admin/leads/summary:
    get:
      operationId: getLeadSummary
      tags: [admin]
      summary: Get enquiry counts and recent activity
      responses:
        "200":
          description: Lead dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSummary"
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "503":
          description: Enquiry storage is not configured
  /admin/leads/{id}:
    patch:
      operationId: updateLead
      tags: [admin]
      summary: Update an enquiry status or internal notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 24
            maxLength: 24
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid request
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "404":
          description: Enquiry not found
        "503":
          description: Enquiry storage is not configured
  /admin/leads/export:
    get:
      operationId: exportLeads
      tags: [admin]
      summary: Download all enquiries as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "503":
          description: Enquiry storage is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LeadStatus:
      type: string
      enum: [new, contacted, quoted, booked, closed]
    PropertyType:
      type: string
      enum: [house, apartment, office, other]
    MovingService:
      type: string
      enum:
        - household-shifting
        - office-relocation
        - packing-unpacking
        - loading-unloading
        - local-moving
        - long-distance-moving
    LeadInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 7
          maxLength: 30
        email:
          type: ["string", "null"]
          format: email
          maxLength: 254
        pickupLocation:
          type: string
          minLength: 2
          maxLength: 240
        destination:
          type: string
          minLength: 2
          maxLength: 240
        movingDate:
          type: string
          format: date
        propertyType:
          $ref: "#/components/schemas/PropertyType"
        services:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MovingService"
        additionalDetails:
          type: string
          maxLength: 3000
        website:
          type: string
          maxLength: 0
          description: Hidden anti-spam field; must remain empty.
      required:
        - name
        - phone
        - pickupLocation
        - destination
        - movingDate
        - propertyType
        - services
        - website
    LeadCreated:
      type: object
      properties:
        received:
          type: boolean
        reference:
          type: string
      required: [received, reference]
    Lead:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        pickupLocation:
          type: string
        destination:
          type: string
        movingDate:
          type: string
          format: date
        propertyType:
          $ref: "#/components/schemas/PropertyType"
        services:
          type: array
          items:
            $ref: "#/components/schemas/MovingService"
        additionalDetails:
          type: string
        source:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        internalNotes:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - phone
        - email
        - pickupLocation
        - destination
        - movingDate
        - propertyType
        - services
        - additionalDetails
        - source
        - status
        - internalNotes
        - createdAt
    LeadUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/LeadStatus"
        internalNotes:
          type: string
          maxLength: 5000
      minProperties: 1
    LeadPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required: [items, total, page, pageSize]
    LeadStatusCount:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/LeadStatus"
        count:
          type: integer
      required: [status, count]
    LeadSummary:
      type: object
      properties:
        total:
          type: integer
        newToday:
          type: integer
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/LeadStatusCount"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
      required: [total, newToday, byStatus, recent]
    AdminSession:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
      required: [userId, name, email]

